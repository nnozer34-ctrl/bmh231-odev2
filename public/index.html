<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozok Etkinlik Panosu</title>
    <link rel="stylesheet" href="stil.css">
    <script src="betik.js" defer></script>
</head>

<body>
    <header class="ust-bant">
        <div class="logo">Bozok Etkinlik</div>
        <nav>
            <a href="#liste">Etkinlikler</a>
            <a href="#oner">Etkinlik Öner</a>
        </nav>
    </header>
    <main>
        <section id="liste">
            <h1>Yaklaşan Etkinlikler</h1>
            <div class="arac-cubugu">
                <div class="filtreler">
                    <button type="button" class="filtre secili" data-tur="tumu">Tümü</button>
                    <button type="button" class="filtre" data-tur="atolye">Atölye</button>
                    <button type="button" class="filtre" data-tur="soylesi">Söyleşi</button>
                    <button type="button" class="filtre" data-tur="topluluk">Topluluk</button>
                </div>
                <label for="arama">Etkinlik ara</label>
                <input type="search" id="arama" placeholder="Başlıkta ara...">
            </div>
            <p id="durum"></p>
            <div id="kartlar" class="kartlar"></div>
        </section>
        <section id="oner">
            <h2>Etkinlik Öner</h2>
            <form id="oneri-formu" novalidate>
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad">

                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih">

                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" name="eposta">

                <button type="submit">Öner</button>
            </form>
            <p id="form-ileti"></p>
        </section>
    </main>
    <footer>
        <p>© 2026 Bozok Etkinlik · BMH231 Web Programlama Ödev 2</p>
    </footer>
</body>

</html>
